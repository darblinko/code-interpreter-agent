[project]
name = "code-interpreter-agent"
version = "0.1.0"
description = "A small agent loop that writes and runs Python in an isolated executor."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.50"]
ui = ["streamlit>=1.40"]
examples = ["matplotlib>=3.8"]

[project.scripts]
cia = "code_interpreter_agent.cli.main:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "matplotlib>=3.8", "numpy>=1.26", "streamlit>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_interpreter_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "live: calls a real model API; needs CIA_LIVE_TESTS=1 and a provider key",
    "docker: needs a Docker daemon and CIA_DOCKER_TESTS=1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
